name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils

      - name: Build project
        run: |
          make clean
          make

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bootx64-efi
          path: build/BOOTX64.EFI
          if-no-files-found: error
