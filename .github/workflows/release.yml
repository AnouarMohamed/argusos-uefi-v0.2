name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Package removable-media tree
        run: tar -czf argusos-uefi-usb-tree.tar.gz -C ./artifacts EFI

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/build/BOOTX64.EFI
            ./argusos-uefi-usb-tree.tar.gz
          generate_release_notes: true
