---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build EFI image
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -target x86_64-pc-win32-coff -ffreestanding -fshort-wchar -mno-red-zone
        -fno-stack-protector -fno-builtin -Wall -Wextra -O2 -Werror

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils

      - name: Install Rust module target
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --target x86_64-pc-windows-msvc
          rustc --version

      - name: Build EFI image
        run: |
          make clean
          make host-check
          make CFLAGS="$CFLAGS"

      - name: Validate EFI output
        run: |
          test -s build/BOOTX64.EFI
          test -s build/desktop.obj
          test -s build/compositor.obj
          test -s build/surface.obj
          test -s build/process.obj
          test -s build/elf_loader.obj
          test -s build/capability.obj
          test -s build/ipc.obj
          test -s build/anonymity.obj
          test -s build/net.obj
          test -s build/user_snake.o
          test -s build/user_snake.elf
          test -s build/user_calculator.o
          test -s build/user_calculator.elf
          test -s build/user_notes.o
          test -s build/user_notes.elf
          test -s build/user_images.obj
          test -s build/pci.obj
          test -s build/ahci.obj
          test -s build/rust_probe.obj
          test -s build/rust_ramfs.obj
          test -s build/rust_fat32.obj
          test -s build/rust_net.obj
          test -z "$(nm -u build/rust_probe.obj)"
          unexpected_symbols="$(
            nm -u build/rust_ramfs.obj |
              awk '$2 != "memcpy" && $2 != "memset" { print $2 }'
          )"
          test -z "$unexpected_symbols"
          nm -u build/rust_ramfs.obj | grep -Fq "memcpy"
          nm -u build/rust_ramfs.obj | grep -Fq "memset"
          fat32_symbols="$(
            nm -u build/rust_fat32.obj |
              awk '$2 != "memcpy" && $2 != "memset" { print $2 }'
          )"
          test -z "$fat32_symbols"
          nm -u build/rust_fat32.obj | grep -Fq "memcpy"
          nm -u build/rust_fat32.obj | grep -Fq "memset"
          net_symbols="$(
            nm -u build/rust_net.obj |
              awk '$2 != "memcmp" && $2 != "memcpy" && $2 != "memset" { print $2 }'
          )"
          test -z "$net_symbols"
          nm -u build/rust_net.obj | grep -Fq "memcmp"
          nm -u build/rust_net.obj | grep -Fq "memcpy"
          nm -u build/rust_net.obj | grep -Fq "memset"
          for app in snake calculator notes; do
            test -z "$(nm -u build/user_${app}.elf)"
            readelf -h build/user_${app}.elf | grep -Fq "0x8000001000"
            readelf -lW build/user_${app}.elf | grep -Eq "LOAD .*R E"
            ! readelf -lW build/user_${app}.elf | grep -Eq "LOAD .*W.*E"
          done
          test -z "$(objdump -p build/BOOTX64.EFI | grep 'DLL Name')"
          file build/BOOTX64.EFI
          ls -l build/BOOTX64.EFI

      - name: Build USB tree
        run: |
          make usb-tree
          test -s EFI/BOOT/BOOTX64.EFI
          ls -l EFI/BOOT/BOOTX64.EFI

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: argusos-uefi-efi
          path: |
            build/BOOTX64.EFI
            EFI/BOOT/BOOTX64.EFI
          if-no-files-found: error

  qemu-smoke:
    name: QEMU smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out host tooling
        uses: actions/checkout@v4

      - name: Download EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 qemu-system-x86 ovmf dosfstools mtools

      - name: Boot in QEMU with OVMF
        run: |
          python3 tools/argus.py smoke \
            --efi artifacts/build/BOOTX64.EFI \
            --memory 1G \
            --log qemu.log

      - name: Validate smoke-test transcript
        run: |
          grep -Fq "ArgusOS UEFI Study Monitor v0.21" qemu.log
          grep -Fq "ARGUS_KERNEL_ONLINE" qemu.log
          grep -Fq "BOOT_SERVICES_EXITED" qemu.log
          grep -Fq "PMM_SELF_TEST_PASS" qemu.log
          grep -Fq "ACPI_MADT_ONLINE" qemu.log
          grep -Fq "PAGING_ONLINE" qemu.log
          grep -Fq "STACK_GUARD_ONLINE" qemu.log
          grep -Fq "HEAP_SELF_TEST_PASS" qemu.log
          grep -Fq "ALLOCATOR_HARDENING_PASS" qemu.log
          grep -Fq "MODULE_ABI_V1_ONLINE" qemu.log
          grep -Fq "RUST_MODULE_SELF_TEST_PASS" qemu.log
          grep -Fq "RAMFS_ABI_V1_ONLINE" qemu.log
          grep -Fq "RUST_RAMFS_SELF_TEST_PASS" qemu.log
          grep -Fq "PCI_DISCOVERY_ONLINE" qemu.log
          grep -Fq "PCI_SELF_TEST_PASS" qemu.log
          grep -Fq "Network controllers: 2" qemu.log
          grep -Fq "Quarantined network controllers: 2" qemu.log
          grep -Fq "NETWORK_DEVICE_BOUNDARY_ONLINE" qemu.log
          grep -Fq "NIC_QUARANTINED" qemu.log
          grep -Fq "VIRTIO_NET_TRANSPORT_VALID" qemu.log
          grep -Fq "RUST_NETWORK_CORE_ONLINE" qemu.log
          grep -Fq "PACKET_PARSER_NEGATIVE_TESTS_PASS" qemu.log
          grep -Fq "BOUNDED_PACKET_QUEUES_PASS" qemu.log
          grep -Fq "TCP_STATE_CORE_PASS" qemu.log
          grep -Fq "NETWORK_EGRESS_DISABLED" qemu.log
          grep -Fq "AHCI_SATA_ONLINE" qemu.log
          grep -Fq "AHCI_IDENTIFY_PASS" qemu.log
          grep -Fq "BLOCK_DEVICE_ONLINE" qemu.log
          grep -Fq "BLOCK_DEVICE_SELF_TEST_PASS" qemu.log
          grep -Fq "FAT32_ABI_V1_ONLINE" qemu.log
          grep -Fq "RUST_FAT32_SELF_TEST_PASS" qemu.log
          grep -Fq "GDT_IDT_ONLINE" qemu.log
          grep -Fq "DOUBLE_FAULT_IST_ONLINE" qemu.log
          grep -Fq "APIC_TIMER_TICK" qemu.log
          grep -Fq "USER_PROCESS_STARTED" qemu.log
          grep -Fq "USER_PROCESS_RESUMED" qemu.log
          grep -Fq "USER_RING3_ONLINE" qemu.log
          grep -Fq "SYSCALL_SYSRET_ONLINE" qemu.log
          grep -Fq "USER_ADDRESS_SPACE_ISOLATION_PASS" qemu.log
          grep -Fq "ELF_LOADER_HARDENING_PASS" qemu.log
          grep -Fq "USER_FAULT_CONTAINMENT_PASS" qemu.log
          grep -Fq "TIMER_PREEMPTION_PASS" qemu.log
          grep -Fq "BLOCKING_EVENT_WAIT_ONLINE" qemu.log
          grep -Fq "PREEMPTIVE_SCHEDULER_PASS" qemu.log
          grep -Fq "CAPABILITY_HANDLES_PASS" qemu.log
          grep -Fq "BOUNDED_IPC_PASS" qemu.log
          grep -Fq "ANONYMITY_FAIL_CLOSED_PASS" qemu.log
          grep -Fq "USER_PROCESS_SELF_TEST_PASS" qemu.log
          grep -Fq "CPP_USERSPACE_ONLINE" qemu.log
          grep -Fq "APP_SURFACE_ABI_V1_ONLINE" qemu.log
          grep -Fq "SNAKE_USER_APP_ONLINE" qemu.log
          grep -Fq "CALCULATOR_USER_APP_ONLINE" qemu.log
          grep -Fq "NOTES_USER_APP_ONLINE" qemu.log
          grep -Fq "DESKTOP_UI_ONLINE" qemu.log
          grep -Fq "SURFACE_SELF_TEST_PASS" qemu.log
          grep -Fq "COMPOSITOR_ONLINE" qemu.log
          grep -Fq "DESKTOP_APPS_ONLINE" qemu.log
          grep -Fq "SNAKE_APP_ONLINE" qemu.log
          grep -Fq "CALCULATOR_APP_ONLINE" qemu.log
          grep -Fq "NOTES_APP_ONLINE" qemu.log
          grep -Fq "APPLICATION_LAUNCHER_ONLINE" qemu.log
          grep -Fq "DESKTOP_UI_REDRAWN" qemu.log
          grep -Fq "PS2_IRQ_ONLINE" qemu.log
          grep -Fq "PS2_MOUSE_IRQ_ONLINE" qemu.log
          grep -Fq "PS2_IRQ_INPUT_OK" qemu.log
          grep -Fq "COMPOSITOR_APPS_OK" qemu.log
          grep -Fq "APP_FOCUS_OK" qemu.log
          grep -Fq "Active app: APPLICATIONS" qemu.log
          grep -Fq "Active app: CALCULATOR" qemu.log
          grep -Fq "Active app: SNAKE" qemu.log
          grep -Fq "KERNEL_SHELL_READY" qemu.log
          grep -Fq "STATUS_OK" qemu.log
          grep -Fq "Processes: 5" qemu.log
          grep -Fq "Completed: 2" qemu.log
          grep -Fq "Contained faults: 1" qemu.log
          grep -Fq "Timer preemptions: " qemu.log
          grep -Fq "Event waits: " qemu.log
          grep -Fq "C++ apps: 3 (ring 3)" qemu.log
          grep -Fq "USERSPACE_STATUS_OK" qemu.log
          grep -Fq "Capability policy: default deny" qemu.log
          grep -Fq "Anonymous transport: offline (fail closed)" qemu.log
          grep -Fq "Clearnet: denied" qemu.log
          grep -Fq "Local DNS: denied" qemu.log
          grep -Fq "Process raw network capabilities: 0" qemu.log
          grep -Fq "Process anonymous stream capabilities: 0" qemu.log
          grep -Fq "Network egress: disabled" qemu.log
          grep -Fq "SECURITY_POLICY_OK" qemu.log
          grep -Fq "Loaded modules: 4" qemu.log
          grep -Fq "rust.netcore (ABI 1)" qemu.log
          grep -Fq "Device: virtio-net" qemu.log
          grep -Fq "PCI state: quarantined" qemu.log
          grep -Fq "DMA: disabled" qemu.log
          grep -Fq "NIC interrupts: disabled" qemu.log
          grep -Fq "Egress: disabled" qemu.log
          grep -Fq "Queue capacity: 8 frames per direction" qemu.log
          grep -Fq "NETWORK_FOUNDATION_OK" qemu.log
          grep -Fq "APP_SURFACE_ABI_OK" qemu.log
          grep -Fq "CALCULATOR_INPUT_OK" qemu.log
          grep -Fq "NOTES_INPUT_OK" qemu.log
          grep -Fq "USER_APPS_OK" qemu.log
          grep -Fq "App state: stopped" qemu.log
          grep -Fq "App state: waiting" qemu.log
          grep -Fq "APP_LIFECYCLE_OK" qemu.log
          grep -Fq "SNAKE_INPUT_OK" qemu.log
          grep -Fq "CPP_USER_APP_OK" qemu.log
          grep -Fq "SNAKE_FRAME_OK" qemu.log
          grep -Fq "Surfaces: 7" qemu.log
          grep -Fq "MODULES_OK" qemu.log
          grep -Fq "ALLOC_OK" qemu.log
          grep -Fq "rust.ramfs (ABI 1)" qemu.log
          grep -Fq "rust.fat32 (ABI 1)" qemu.log
          grep -Fq "RAMFS_STATUS_OK" qemu.log
          grep -Fq "RAMFS_LIST_OK" qemu.log
          grep -Fq "ArgusOS Rust RAMFS" qemu.log
          grep -Fq "Rust RAMFS round trip" qemu.log
          grep -Fq "RAMFS_REMOVE_OK" qemu.log
          grep -Fq "RAMFS error: not found" qemu.log
          grep -Fq "BLOCK_STATUS_OK" qemu.log
          grep -Fq "Device: ahci0" qemu.log
          grep -Fq "PCI_STATUS_OK" qemu.log
          grep -Fq "AHCI_STATUS_OK" qemu.log
          grep -Fq "FAT32_STATUS_OK" qemu.log
          grep -Fq "FAT32_LIST_OK" qemu.log
          grep -Fq "ArgusOS FAT32 via Rust" qemu.log
          grep -Fq "FAT32_CAT_OK" qemu.log
          grep -Fq "FAT32 error: not found" qemu.log
          test -s build/qemu-desktop.ppm
          test -s build/qemu-desktop-apps.ppm
          test -s build/qemu-desktop-calculator.ppm
          test -s build/qemu-desktop-notes.ppm
          test -s build/qemu-desktop-snake.ppm
          file build/qemu-desktop.ppm
          file build/qemu-desktop-apps.ppm
          file build/qemu-desktop-calculator.ppm
          file build/qemu-desktop-notes.ppm
          file build/qemu-desktop-snake.ppm

      - name: Upload desktop captures
        uses: actions/upload-artifact@v4
        with:
          name: argusos-desktop-framebuffer
          path: |
            build/qemu-desktop.ppm
            build/qemu-desktop-apps.ppm
            build/qemu-desktop-calculator.ppm
            build/qemu-desktop-notes.ppm
            build/qemu-desktop-snake.ppm
          if-no-files-found: error

      - name: Require protected fault paths
        run: |
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case breakpoint \
            --log breakpoint.log
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case guard \
            --log guard.log
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case double \
            --log double.log
          grep -Fq "Vector: 3" breakpoint.log
          grep -Fq "STACK_GUARD_FAULT_CAUGHT" guard.log
          grep -Fq "DOUBLE_FAULT_IST_ACTIVE" double.log
