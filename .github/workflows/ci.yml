name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build EFI image
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -target x86_64-pc-win32-coff -ffreestanding -fshort-wchar -mno-red-zone
        -fno-stack-protector -fno-builtin -Wall -Wextra -O2 -Werror

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils

      - name: Build EFI image
        run: |
          make clean
          make CFLAGS="$CFLAGS"

      - name: Validate EFI output
        run: |
          test -s build/BOOTX64.EFI
          file build/BOOTX64.EFI
          ls -l build/BOOTX64.EFI

      - name: Build USB tree
        run: |
          make usb-tree
          test -s EFI/BOOT/BOOTX64.EFI
          ls -l EFI/BOOT/BOOTX64.EFI

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: argusos-uefi-efi
          path: |
            build/BOOTX64.EFI
            EFI/BOOT/BOOTX64.EFI
          if-no-files-found: error

  qemu-smoke:
    name: QEMU smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools

      - name: Prepare FAT32 disk image
        run: |
          if [[ -r /usr/share/OVMF/OVMF_CODE_4M.fd && -r /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            ovmf_code=/usr/share/OVMF/OVMF_CODE_4M.fd
            ovmf_vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [[ -r /usr/share/OVMF/OVMF_CODE.fd && -r /usr/share/OVMF/OVMF_VARS.fd ]]; then
            ovmf_code=/usr/share/OVMF/OVMF_CODE.fd
            ovmf_vars=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF code/variable-store pair found" >&2
            exit 1
          fi

          cp "$ovmf_vars" ./OVMF_VARS.fd
          echo "OVMF_CODE=$ovmf_code" >> "$GITHUB_ENV"

          mkdir -p EFI/BOOT
          cp ./artifacts/build/BOOTX64.EFI ./EFI/BOOT/BOOTX64.EFI
          truncate -s 64M efi-test.img
          mkfs.fat -F32 efi-test.img
          mmd -i efi-test.img ::/EFI
          mmd -i efi-test.img ::/EFI/BOOT
          mcopy -i efi-test.img ./EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI

      - name: Boot in QEMU with OVMF
        run: |
          set +e
          timeout 15s qemu-system-x86_64 \
            -display none \
            -serial stdio \
            -machine accel=tcg \
            -m 1G \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -drive if=virtio,format=raw,file=efi-test.img \
            -no-reboot \
            -monitor none \
            -nodefaults > qemu.log 2>&1
          qemu_status=$?
          set -e

          cat qemu.log
          if [[ $qemu_status -ne 0 && $qemu_status -ne 124 ]]; then
            echo "QEMU failed with status $qemu_status" >&2
            exit "$qemu_status"
          fi
          grep -Fq "ArgusOS UEFI Study Monitor v" qemu.log
          grep -Fq "argus64>" qemu.log
