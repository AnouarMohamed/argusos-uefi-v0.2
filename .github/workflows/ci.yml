---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build EFI image
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -target x86_64-pc-win32-coff -ffreestanding -fshort-wchar -mno-red-zone
        -fno-stack-protector -fno-builtin -Wall -Wextra -O2 -Werror

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils

      - name: Install Rust module target
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --target x86_64-pc-windows-msvc
          rustc --version

      - name: Build EFI image
        run: |
          make clean
          make host-check
          make CFLAGS="$CFLAGS"

      - name: Validate EFI output
        run: |
          test -s build/BOOTX64.EFI
          test -s build/rust_probe.obj
          test -s build/rust_ramfs.obj
          test -z "$(nm -u build/rust_probe.obj)"
          unexpected_symbols="$(
            nm -u build/rust_ramfs.obj |
              awk '$2 != "memcpy" && $2 != "memset" { print $2 }'
          )"
          test -z "$unexpected_symbols"
          nm -u build/rust_ramfs.obj | grep -Fq "memcpy"
          nm -u build/rust_ramfs.obj | grep -Fq "memset"
          test -z "$(objdump -p build/BOOTX64.EFI | grep 'DLL Name')"
          file build/BOOTX64.EFI
          ls -l build/BOOTX64.EFI

      - name: Build USB tree
        run: |
          make usb-tree
          test -s EFI/BOOT/BOOTX64.EFI
          ls -l EFI/BOOT/BOOTX64.EFI

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: argusos-uefi-efi
          path: |
            build/BOOTX64.EFI
            EFI/BOOT/BOOTX64.EFI
          if-no-files-found: error

  qemu-smoke:
    name: QEMU smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out host tooling
        uses: actions/checkout@v4

      - name: Download EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 qemu-system-x86 ovmf dosfstools mtools

      - name: Boot in QEMU with OVMF
        run: |
          python3 tools/argus.py smoke \
            --efi artifacts/build/BOOTX64.EFI \
            --memory 1G \
            --log qemu.log

      - name: Validate smoke-test transcript
        run: |
          grep -Fq "ArgusOS UEFI Study Monitor v0.9" qemu.log
          grep -Fq "ARGUS_KERNEL_ONLINE" qemu.log
          grep -Fq "BOOT_SERVICES_EXITED" qemu.log
          grep -Fq "PMM_SELF_TEST_PASS" qemu.log
          grep -Fq "ACPI_MADT_ONLINE" qemu.log
          grep -Fq "PAGING_ONLINE" qemu.log
          grep -Fq "STACK_GUARD_ONLINE" qemu.log
          grep -Fq "HEAP_SELF_TEST_PASS" qemu.log
          grep -Fq "ALLOCATOR_HARDENING_PASS" qemu.log
          grep -Fq "MODULE_ABI_V1_ONLINE" qemu.log
          grep -Fq "RUST_MODULE_SELF_TEST_PASS" qemu.log
          grep -Fq "RAMFS_ABI_V1_ONLINE" qemu.log
          grep -Fq "RUST_RAMFS_SELF_TEST_PASS" qemu.log
          grep -Fq "GDT_IDT_ONLINE" qemu.log
          grep -Fq "DOUBLE_FAULT_IST_ONLINE" qemu.log
          grep -Fq "APIC_TIMER_TICK" qemu.log
          grep -Fq "PS2_IRQ_ONLINE" qemu.log
          grep -Fq "PS2_IRQ_INPUT_OK" qemu.log
          grep -Fq "KERNEL_SHELL_READY" qemu.log
          grep -Fq "STATUS_OK" qemu.log
          grep -Fq "MODULES_OK" qemu.log
          grep -Fq "ALLOC_OK" qemu.log
          grep -Fq "rust.ramfs (ABI 1)" qemu.log
          grep -Fq "RAMFS_STATUS_OK" qemu.log
          grep -Fq "RAMFS_LIST_OK" qemu.log
          grep -Fq "ArgusOS Rust RAMFS" qemu.log
          grep -Fq "Rust RAMFS round trip" qemu.log
          grep -Fq "RAMFS_REMOVE_OK" qemu.log
          grep -Fq "RAMFS error: not found" qemu.log

      - name: Require protected fault paths
        run: |
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case breakpoint \
            --log breakpoint.log
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case guard \
            --log guard.log
          python3 tools/argus.py fault \
            --efi artifacts/build/BOOTX64.EFI \
            --case double \
            --log double.log
          grep -Fq "Vector: 3" breakpoint.log
          grep -Fq "STACK_GUARD_FAULT_CAUGHT" guard.log
          grep -Fq "DOUBLE_FAULT_IST_ACTIVE" double.log
