name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EFI image
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -target x86_64-pc-win32-coff -ffreestanding -fshort-wchar -mno-red-zone
        -fno-stack-protector -fno-builtin -Wall -Wextra -O2 -Werror

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils

      - name: Build EFI image
        run: |
          make clean
          make CFLAGS="$CFLAGS"

      - name: Validate EFI output
        run: |
          test -s build/BOOTX64.EFI
          file build/BOOTX64.EFI
          ls -l build/BOOTX64.EFI

      - name: Build USB tree
        run: |
          make usb-tree
          test -s EFI/BOOT/BOOTX64.EFI
          ls -l EFI/BOOT/BOOTX64.EFI

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: argusos-uefi-efi
          path: |
            build/BOOTX64.EFI
            EFI/BOOT/BOOTX64.EFI
          if-no-files-found: error

  qemu-smoke:
    name: QEMU smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools

      - name: Prepare FAT32 disk image
        run: |
          mkdir -p EFI/BOOT
          cp ./artifacts/build/BOOTX64.EFI ./EFI/BOOT/BOOTX64.EFI
          truncate -s 64M efi-test.img
          mkfs.fat -F32 efi-test.img
          mcopy -i efi-test.img ./EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI

      - name: Boot in QEMU with OVMF
        run: |
          timeout 20s qemu-system-x86_64 \
            -display none \
            -serial stdio \
            -machine accel=tcg \
            -m 1G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/usr/share/OVMF/OVMF_VARS.fd \
            -drive if=virtio,format=raw,file=efi-test.img \
            -no-reboot \
            -monitor none \
            -nodefaults

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, qemu-smoke ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: argusos-uefi-efi
          path: ./artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/build/BOOTX64.EFI
            ./artifacts/EFI/BOOT/BOOTX64.EFI
          generate_release_notes: true
